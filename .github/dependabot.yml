version: 2
updates:
  # Keep the GitHub Actions used by CI up to date. Actions are referenced by
  # major version tags in the workflows; Dependabot proposes the version bumps
  # and, when actions are pinned to a commit SHA, updates the SHA as well.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

